name: Generate Content

on:
  schedule:
    # Runs at 3am UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of articles to generate (default 10)'
        required: false
        default: '10'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node pipeline/generate.js

      - name: Commit and push new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/guides/ pipeline/keywords.json
          git diff --staged --quiet || git commit -m "chore: generate new articles [skip ci]"
          git push
